<!DOCTYPE html>
<html lang="el">
<head><link rel="manifest" href="akoustika.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ακουστικά — Κατανόηση Προφορικού Λόγου</title>
<meta name="theme-color" content="#10232b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#10232b; --bg2:#183440; --line:#2c5160;
  --accent:#f0b04a; --accent-dk:#cf9132;
  --card:#f4efe4; --ink:#1d2a2f; --ink-soft:#5f6d72;
  --known:#5fae76; --notquite:#3fb0c9; --important:#e0675a;
  --ok:#2f9a55; --okbg:#d9f0df; --bad:#cf4536; --badbg:#f8dcd8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#e4eef1;
  font-family:"Segoe UI",Roboto,"Noto Sans",system-ui,-apple-system,Arial,sans-serif;}
body{padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 14px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:25px;margin:0;font-weight:700}
h1 em{font-style:italic;color:var(--accent)}
#counter{font-size:14px;color:#9db6bf;white-space:nowrap}
.piles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.pile{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:11px 12px;
  text-align:left;cursor:pointer;color:inherit;font:inherit}
.pile .num{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1}
.pile .lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#8fa9b2;margin-top:5px}
.pile .lbl i{font-style:normal;text-transform:none;letter-spacing:0;color:#b8cbd1}
[data-p="live"] .num,[data-p="live"] .t{color:var(--accent)}
[data-p="known"] .num,[data-p="known"] .t{color:var(--known)}
[data-p="notquite"] .num,[data-p="notquite"] .t{color:var(--notquite)}
[data-p="important"] .num,[data-p="important"] .t{color:var(--important)}
.pile.sel{border-color:var(--accent);background:#21444f}
.pile[data-p="known"].sel{border-color:var(--known)}
.pile[data-p="notquite"].sel{border-color:var(--notquite)}
.pile[data-p="important"].sel{border-color:var(--important)}
.card{background:var(--card);color:var(--ink);border-radius:12px;padding:18px 16px 20px;min-height:260px}
.qnum{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);
  display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.dots{display:flex;gap:4px;margin:0 0 12px}
.dots span{flex:1;height:6px;border-radius:3px;background:#ddd5c6}
.dots span.cur{background:#b9ad97}
.dots span.ok{background:var(--ok)}
.dots span.bad{background:var(--bad)}
.dots span.gap{flex:0 0 6px;background:none}
.instr{font-size:13.5px;line-height:1.4;color:var(--ink-soft);font-style:italic;
  border-left:3px solid #d6cbb6;padding:2px 0 2px 10px;margin-bottom:14px}
.part{font-weight:700;font-style:normal;color:#8a6a2c;letter-spacing:1px}
.q{font-size:21px;line-height:1.38;font-weight:700;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.tf{flex-direction:row}
.opts.tf .opt{flex:1;text-align:center;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:#fffdf7;border:2px solid #ddd3c2;border-radius:10px;padding:12px 13px;
  font-size:17px;line-height:1.35;color:var(--ink)}
.opt .l{font-weight:700;color:#8a6a2c;min-width:20px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
button{font:inherit;cursor:pointer;border:none}
#go{width:100%;margin-top:14px;background:var(--accent);color:#24180a;font-weight:700;
  font-size:17px;padding:15px;border-radius:10px}
#go:active{background:var(--accent-dk)}
.sum h2{font-family:Georgia,serif;font-size:24px;margin:2px 0 4px}
.sum .score{font-size:16px;color:var(--ink-soft);margin-bottom:14px}
.miss{border-top:1px solid #e0d7c7;padding:10px 0;font-size:15px;line-height:1.4}
.miss .mq{font-weight:700}
.miss .y{color:var(--bad)}
.miss .c{color:var(--ok)}
.allok{font-size:17px;color:var(--ok);font-weight:700;padding:8px 0}
.hint{font-size:13px;color:#9db6bf;text-align:center;margin:14px 0 2px}
.sorts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.sort{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:11px 6px;
  color:#e4eef1;text-align:center;line-height:1.25}
.sort .t{font-weight:700;font-size:15px}
.sort .s{font-size:11.5px;color:#8fa9b2;margin-top:2px}
.sort.pick{border-color:#fff;background:#2a5664;box-shadow:0 0 0 2px var(--accent) inset}
.sort.pick .s{color:#fff}
.jump{display:flex;gap:10px;margin-top:10px}
.jump input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  color:#e4eef1;font:inherit;font-size:16px;padding:11px 12px}
.jump input::placeholder{color:#7e99a2}
.jump input:focus{outline:none;border-color:var(--accent)}
.jump button{background:var(--accent);color:#24180a;font-weight:700;border-radius:9px;padding:11px 18px;font-size:15px}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.nav button{background:var(--bg2);border:1px solid var(--line);color:#cfe0e5;
  padding:11px 16px;border-radius:9px;font-size:15px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
  font-size:12.5px;color:#7e99a2;flex-wrap:wrap;gap:8px}
footer .acts{display:flex;gap:14px}
footer .acts button{background:none;color:#9db6bf;text-decoration:underline;padding:4px 0;font-size:12.5px}
#restore-file{display:none}
.empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:17px;line-height:1.6}
.player{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.player .row{display:flex;align-items:center;gap:10px}
.player button{background:var(--accent);color:#24180a;border-radius:50%;width:46px;height:46px;
  font-size:19px;font-weight:700;flex:0 0 46px;display:flex;align-items:center;justify-content:center}
.player button.sm{background:#24495a;color:#e4eef1;width:40px;height:40px;flex-basis:40px;font-size:12px;font-weight:700}
.player input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.player .tm{font-size:12.5px;color:#9db6bf;font-variant-numeric:tabular-nums;white-space:nowrap}
.player .lab{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#8fa9b2;margin-bottom:7px}
.player .none{font-size:13.5px;color:#9db6bf;line-height:1.4}
.player .none button{all:unset;color:var(--accent);text-decoration:underline;cursor:pointer}
#audio-file{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#071419;color:#e4eef1;
  border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;z-index:60;max-width:92vw;text-align:center}
.hide{display:none !important}
</style>
</head>
<body>
<header>
  <h1>Ακουστικά <em>Π.Ε.Γ.Π.</em></h1>
  <div id="counter">0 / 0</div>
</header>

<div class="piles">
  <button class="pile" data-p="live"><div class="num" id="n-live">0</div><div class="lbl">Live</div></button>
  <button class="pile" data-p="known"><div class="num" id="n-known">0</div><div class="lbl">Known</div></button>
  <button class="pile" data-p="notquite"><div class="num" id="n-notquite">0</div><div class="lbl">Not quite</div></button>
  <button class="pile" data-p="important"><div class="num" id="n-important">0</div><div class="lbl">Important</div></button>
</div>

<div class="player" id="player">
  <div class="lab" id="p-lab">Ήχος</div>
  <div class="row" id="p-ctrl">
    <button id="p-play" aria-label="Play">▶</button>
    <button class="sm" id="p-back" aria-label="Back 10 seconds">−10</button>
    <input type="range" id="p-seek" min="0" max="1000" value="0" aria-label="Position">
    <span class="tm" id="p-time">0:00 / 0:00</span>
  </div>
  <div class="none hide" id="p-none"></div>
  <audio id="p-audio" preload="metadata"></audio>
</div>

<div class="card" id="card"></div>

<button id="go">Next question</button>

<div id="filing" class="hide">
  <div class="hint">Tap a pile to re-assign, then Confirm &amp; next</div>
  <div class="sorts">
    <button class="sort" data-p="live"><div class="t">Live</div><div class="s">see again</div></button>
    <button class="sort" data-p="known"><div class="t">Known</div><div class="s">I know it</div></button>
    <button class="sort" data-p="notquite"><div class="t">Not quite</div><div class="s">nearly there</div></button>
    <button class="sort" data-p="important"><div class="t">Important</div><div class="s">needs work</div></button>
  </div>
</div>

<div class="jump">
  <input id="jump-n" type="number" inputmode="numeric" min="1" max="50" placeholder="Θέμα 1–50">
  <button id="jump-go">Go to Θέμα</button>
</div>

<div class="nav">
  <button id="back">&larr; Back</button>
  <button id="shuffle">Shuffle</button>
  <button id="skip">Skip &rarr;</button>
</div>

<footer>
  <span>50 θέματα &middot; Νοέμβριος 2026</span>
  <span class="acts">
    <button id="backup">Backup</button>
    <button id="restore">Restore</button>
    <button id="aud">Audio (0/50)</button>
    <button id="reset">Reset piles</button>
  </span>
  <input type="file" id="restore-file" accept="application/json,.json">
  <input type="file" id="audio-file" accept="audio/*,.mp3" multiple>
  <div class="toast hide" id="toast"></div>
</footer>

<script>
var TOPICS = [{"n":1,"ia":"Ακούστε τη συζήτηση δύο φίλων για τα χόμπι τους και επιλέξτε τη σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε την περιγραφή μιας μέρας ενός μαθητή και σημειώστε τις Σωστές (Σ) και Λάθος (Λ) προτάσεις.","A":[{"q":"Τι καινούργιο χόμπι ξεκίνησε ο Γιώργος;","o":["μαθήματα χορού","ζωγραφική","περίπατο"],"c":1},{"q":"Πώς νιώθει η Μαρία για τα μαθήματα χορού;","o":["τα βρίσκει διασκεδαστικά","τα βρίσκει κουραστικά","δεν της αρέσουν"],"c":0},{"q":"Ο Γιώργος προτιμά:","o":["γυμναστική","ήσυχες δραστηριότητες","ομαδικά παιχνίδια"],"c":1},{"q":"Η Μαρία ρωτάει τον Γιώργο αν:","o":["θα πάρει μέρος σε έκθεση","θα συνεχίσει να ζωγραφίζει","θα ξεκινήσει χορό"],"c":0},{"q":"Ο Γιώργος ζωγραφίζει:","o":["για διασκέδαση","γιατί δεν του αρέσει καμία άλλη δραστηριότητα.","για να κάνει δώρα τις ζωγραφιές του σε άλλους."],"c":0}],"B":[{"q":"Ο μαθητής ξύπνησε στις 8:00.","c":false},{"q":"Αγαπημένο μάθημα του μαθητή είναι τα μαθηματικά.","c":true},{"q":"Ο μαθητής έφαγε μεσημεριανό μετά το σχολείο.","c":true},{"q":"Το βράδυ ο μαθητής διάβασε για το τεστ.","c":false},{"q":"Ο μαθητής χαλάρωσε βλέποντας τηλεόραση.","c":true}]},{"n":2,"ia":"Ακούστε μία ανακοίνωση της Ελληνικής Ένωσης Τραπεζών και επιλέξτε τη σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε την ανακοίνωση μιας κατασκήνωσης και σημειώστε με Χ τις σωστές (Σ) και λάθος (Λ) προτάσεις.","A":[{"q":"Η Ελληνική Ένωση Τραπεζών ενημερώνει τους πολίτες για συναλλαγές που δεν θα γίνονται:","o":["μέσα στην τράπεζα.","στα αυτόματα μηχανήματα.","με κανέναν τρόπο."],"c":0},{"q":"Οι πολίτες μπορούν να πάρουν μετρητά μέχρι 400 ευρώ:","o":["με χρεωστική κάρτα.","με το βιβλιάριο.","μέσω Ίντερνετ."],"c":0},{"q":"Οι καταθέσεις ως 1000 ευρώ γίνονται:","o":["με το βιβλιάριο.","μέσω διαδικτύου.","στα αυτόματα μηχανήματα."],"c":2},{"q":"Ενημέρωση λογαριασμού γίνεται","o":["με το βιβλιάριο.","μόνο στα αυτόματα μηχανήματα.","στα αυτόματα μηχανήματα ή μέσω ίντερνετ."],"c":2},{"q":"Για να πληρώσει κανείς έναν λογαριασμό:","o":["Πρέπει να πάει στην τράπεζα.","Μπορεί να χρησιμοποιήσει το διαδίκτυο","Πρέπει να έχει βιβλιάριο"],"c":1}],"B":[{"q":"Χιλιάδες μαθητές και καθηγητές επιλέγουν και εμπιστεύονται την αθλητική κατασκήνωση «οι αργοναύτες».","c":false},{"q":"Οι μαθητές πηγαίνουν στην κατασκήνωση για τις αθλητικές δράσεις.","c":true},{"q":"Οι εγκαταστάσεις και τα στελέχη είναι λόγοι επιλογής της κατασκήνωσης από τους γονείς","c":true},{"q":"Εδώ και 35 χρόνια λειτουργούν τμήματα για παιδιά προσχολικής ηλικίας","c":false},{"q":"Οι μαθητές δευτεροβάθμιας εκπαίδευσης μπορούν να πάνε στην κατασκήνωση τον Ιούνιο.","c":false}]},{"n":3,"ia":"Ακούστε μία διαφήμιση του μανάβικου «Η ωραία Ελένη» και επιλέξτε τη σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε μία περιγραφή για τον Παρθενώνα και σημειώστε με Χ τις σωστές (Σ) και λάθος (Λ) προτάσεις.","A":[{"q":"Το μανάβικο «Η Ωραία Ελένη» πουλάει","o":["μόνο φρούτα.","μόνο λαχανικά.","διάφορα προϊόντα."],"c":2},{"q":"Τα προϊόντα είναι εξαιρετικά γιατί","o":["είναι ντόπια.","η διατροφή έχει σημασία.","είναι φρέσκα."],"c":1},{"q":"Τα φρούτα και τα λαχανικά είναι όλα καλά γιατί","o":["τα καλλιεργούν οι ίδιοι.","είναι φτηνά.","είναι πολλά."],"c":0},{"q":"Οι τιμές στο μανάβικο είναι","o":["ίδιες με όλα τα άλλα μανάβικα.","είναι οι πιο ακριβές της αγοράς.","είναι οι πιο φτηνές της αγοράς."],"c":2},{"q":"Μπορεί κάποιος να κάνει αγορές στο μανάβικο","o":["από το διαδίκτυο.","από το τηλέφωνο.","με ηλεκτρονικό ταχυδρομείο."],"c":1}],"B":[{"q":"Ο Παρθενώνας χτίστηκε τον 5ο αιώνα π.Χ","c":true},{"q":"Ο ρυθμός του Παρθενώνα είναι ιωνικός.","c":false},{"q":"Ο ναός σχεδιάστηκε από τους αρχιτέκτονες Ικτίνο και Καλλικράτη.","c":true},{"q":"Το μήκος και το πλάτος του Παρθενώνα αποτελείται από ίσο αριθμό κιόνων.","c":false},{"q":"Με σύγχρονα μέσα, μπορεί να ξαναγίνει ένας ίδιος ναός.","c":false}]},{"n":4,"ia":"Ακούστε την ιστορία της Μαρίας Κάλλας και επιλέξτε την σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε ένα μήνυμα για τον Όλυμπο και σημειώστε τις Σωστές (Σ) και Λάθος (Λ) προτάσεις.","A":[{"q":"Η Μαρία Κάλλας","o":["από μικρή ηλικία ήταν καλή μαθήτρια.","από μικρή ηλικία είχε υπέροχη φωνή.","όταν ήταν μικρή, είχε κερδίσει σε διαγωνισμό ζωγραφικής."],"c":1},{"q":"το 1937 η Κάλλας","o":["επέστρεψε στην Ελλάδα με όλη της την οικογένεια.","γράφτηκε μαζί με την αδερφή της στο Εθνικό Ωδείο της Αθήνας.","εγκαταστάθηκε στην Αθήνα, χωρίς τον πατέρα της."],"c":2},{"q":"Έγινε παγκοσμίως γνωστή, όταν τραγούδησε","o":["στη «Σκάλα» του Μιλάνου».","στην Όπερα της Νέας Υόρκης.","την «Τζιοκόντα»."],"c":2},{"q":"Ο Μενεγκίνι","o":["λάτρεψε τη φωνή της Κάλλας.","τη βοήθησε στη δουλειά της.","θαύμασε την Κάλλας για την ομορφιά της."],"c":1},{"q":"Στο τέλος της καριέρας της η Κάλλας","o":["ζούσε μόνη και μακριά από τον κόσμο.","έκανε έναν ακόμη γάμο.","τραγούδησε στην όπερα της Νέας Υόρκης"],"c":0}],"B":[{"q":"Ο Όλυμπος είναι γνωστός σε όλο τον κόσμο επειδή είναι το ψηλότερο βουνό της Ελλάδας.","c":false},{"q":"Σύμφωνα με τη μυθολογία, στον Όλυμπο κατοικούσαν οι 12 θεοί.","c":true},{"q":"Ένας από τους λόγους επίσκεψης του Ολύμπου είναι η φυσική ομορφιά.","c":true},{"q":"Οι αθλητές ακολουθούν μία συγκεκριμένη διαδρομή.","c":false},{"q":"Το Λιτόχωρο βρίσκεται 100 χιλιόμετρα από τη Θεσσαλονίκη.","c":true}]},{"n":5,"ia":"Ακούστε ένα μήνυμα από μια ιστοσελίδα που υπόσχεται να κάνει τη ζωή σας ευκολότερη. Επιλέξτε τη σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε την εισαγωγή μίας ραδιοφωνικής εκπομπής για παραγωγούς στην Ελλάδα και σημειώστε με Χ τις σωστές (Σ) και λάθος (Λ) προτάσεις.","A":[{"q":"Το μήνυμα έχει στόχο:","o":["να βοηθήσει κάποιον να μην μπερδεύεται στο σούπερ μάρκετ.","να μην γυρίζει στο σπίτι με παραπάνω ψώνια.","να βοηθήσει κάποιον να μην ξεχνά όσα πρέπει να αγοράσει."],"c":2},{"q":"Η προτεινόμενη λίστα θα βοηθήσει κάποιον στο να:","o":["να ξέρει σε ποιο ράφι να κοιτάξει.","να χωρίζει τα ψώνια σε κατηγορίες.","κάνει τα ψώνια γρήγορα."],"c":2},{"q":"Στη λίστα","o":["υπάρχου βού.","αν τηλεφωνήσετε στο οδοντιατρικό κέντρο."],"c":2},{"q":"Το ιατρείο είναι ανοιχτό","o":["κάθε μέρα εκτός Σαββάτου και Κυριακής.","όλες τις εργάσιμες ημέρες και τα Σάββατα.","μόνο τις εργάσιμες ημέρες."],"c":1},{"q":"Μπορείτε να κάνετε έναν οδοντιατρικό έλεγχο","o":["κάθε απόγευμα εκτός Σαββάτου.","κάθε απόγευμα από τις 6 έως τις 8 και μισή.","κάθε Τρίτη και Πέμπτη απόγευμα."],"c":2},{"q":"Πριν από την επίσκεψη σας","o":["πρέπει να κλείσετε ραντεβού.","πρέπει να αφήσετε μήνυμα για ραντεβού.","πρέπει να μιλήσετε με τον υπεύθυνο γιατρό."],"c":0},{"q":"Το τμήμα για τα ραντεβού λειτουργεί","o":["μόνο τα απογεύματα.","καθημερινά πρωί και απόγευμα.","καθημερινά ως τις 2 μμ."],"c":2}],"B":[{"q":"Ο διάλογος που ακούσατε γίνεται σε ένα σπίτι.","c":false},{"q":"Ο άνδρας και η γυναίκα είναι καλοί φίλοι.","c":false},{"q":"Η γυναίκα μένει μόνιμα στα Ζαγοροχώρια.","c":false},{"q":"Το μουσείο βρίσκεται σε ένα κοντινό χωριό.","c":true},{"q":"Η οικογένεια θα κάνει μια επίσκεψη στο μουσείο.","c":true}]},{"n":21,"ia":"Τηλεφωνείτε στον κινηματογράφο: Ακούστε το παρακάτω μήνυμα και επιλέξτε τη σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε έναν διάλογο μεταξύ μιας γυναίκας και ενός άνδρα σε μία τράπεζα. Σημειώστε με Χ τις σωστές (Σ) και λάθος (Λ) προτάσεις.","A":[{"q":"Οι προβολές πραγματοποιούνται","o":["κάθε μέρα εκτός Σαββάτου και Κυριακής.","κάθε μέρα.","μόνο τα Σαββατοκύριακα."],"c":1},{"q":"Η ταινία «Ο Ζορμπάς»","o":["είναι σχετική με ένα βιβλίο.","είναι μόνο για παιδιά.","είναι ταινία δράσης."],"c":0},{"q":"Το εισιτήριο για τους ενήλικες κοστίζει","o":["7 ευρώ.","8 ευρώ.","9 ευρώ."],"c":1},{"q":"Τα παιδιά μπορούν να παρακολουθήσουν","o":["μια παιδική θεατρική παράσταση.","την ταινία «Ο Ζορμπάς».","την ταινία «Το ταξίδι του Οδυσσέα»."],"c":2},{"q":"Στα εισιτήρια","o":["ισχύουν εκπτώσεις για παιδιά και φοιτητές.","ισχύουν εκπτώσεις για παιδιά και τους γονείς τους.","δεν ισχύουν εκπτώσεις."],"c":0}],"B":[{"q":"Ο υπάλληλος χρειάζεται το βιβλιάριο καταθέσεων της γυν ","κάθε 18 μήνες."],"c":0}],"B":[{"q":"Οι γονείς που συζητούν έχουν παιδιά στο Νηπιαγωγείο.","c":false},{"q":"Η Σχολή Γονέων λειτουργεί για ένα άτομο κάθε φορά.","c":false},{"q":"Οι γονείς μπορούν να πηγαίνουν στη Σχολή Γονέων δυο φορές την εβδομάδα.","c":false},{"q":"Η κάθε συνάντηση είναι μονόωρη.","c":true},{"q":"Ο άνδρας αποφασίζει να πάει στη Σχολή Γονέων.","c":true}]},{"n":31,"ia":"Ακούστε ένα κείμενο με χρήσιμες πληροφορίες για όσους πρόκειται να συμμετέχουν στις εκλογές και επιλέξτε τη σωστή απάντηση στις ερωτήσεις που ακολουθούν.","ib":"Ακούστε έναν διάλογο μεταξύ δύο φίλων που θέλουν να επισκεφτούν το νησί της Φολέγανδρου. Σημειώστε με Χ τις σωστές (Σ) και λάθος (Λ) προτάσεις.","A":[{"q":"Πόσες ώρες διαρκεί η ψηφοφορία;","o":["7 ώρες.","12 ώρες.","15 ώρες."],"c":1},{"q":"Η συμμετοχή στις Δημοτικές Εκλογές","o":["είναι υποχρεωτική.","είναι για όσους είναι κάτω από 17 ετών.","είναι για όλους τους πολίτες."],"c":0},{"q":"Μπορεί κάποιος να μάθει που ψηφίζει:","o":["αν μπει στην ιστοσελίδα του Υπουργείου.","αν αναζητήσει το όνομά του στον τηλεφωνικό κατάλογο.","αν απευθυνθεί σε έναν δικηγόρο."],"c":0},{"q":"Το Υπουργείο Εσωτερικών απαντάει σε τηλεφωνήματα","o":["καθημερινά από τις 9 πμ έως 5 μμ.","όλες τις ημέρες από τις 9 πμ έως τις 5 μμ.","μόνο τις Κυριακές από τις 9 πμ έως τις 5 μμ."],"c":1},{"q":"Για όσους ψηφίζουν σε μακρινή περιοχή:","o":["υπάρχει πρόβλεψη για άδεια κάποιων ημερών.","η ψηφοφορία δεν είναι υποχρεωτική.","υπάρχει τηλέφωνο επικοινωνίας."],"c":0}],"B":[{"q":"Η Φολέγανδρος είναι νησί των Δωδεκανήσων.","c":false},{"q":"Μπορεί να μετακινηθεί κανείς από τη Φολέγανδρο στη Σαντορίνη με καράβι.","c":true},{"q":"Ο επισκέπτης της Φολέγανδρου έχει την ευκαιρία να δει ένα κάστρο.","c":true},{"q":"Η πιο δημοφιλής παραλία του νησιού είναι το Κάτεργο.","c":false},{"q":"Στην παραλία Αγκάλη ο επισκέπτης μπορεί να πάει μόνο με καραβάκι.","c":false}]},{"n":32,"ia":"Ακούστε μια σύντομη περιγραφή για την Ακρόπολη των Αθηνών και επιλέξτε τη σωστή απάντηση στις ερ /* Saved state
   piles[n]  : which pile topic n is in
   order[p]  : the running order of all 50 topics for pile p (changes only on Shuffle)
   at[p]     : the topic pile p was on when you left it
   prog[p]   : half-finished topic in pile p: {n, step, ans:[...], pick}
   pile      : the pile you are studying                                            */
var piles = {}, order = {}, at = {}, prog = {}, held = {}, pile = 'live';
/* held[n]: a half-done topic you left via Skip/Back/Go to — resumes when you come back to it */
var queue = [];          /* topics currently in this pile, in this pile's order */
var cur = null;          /* {n, step, ans, pick} for the topic on screen */

function topic(n){ return TOPICS[n-1]; }
function items(t){       /* the 10 questions of a topic, Part A then Part B */
  var a = t.A.map(function(q,i){ return {part:'A', i:i, q:q.q, o:q.o, c:q.c}; });
  var b = t.B.map(function(q,i){ return {part:'B', i:i, q:q.q, o:['Σωστό','Λάθος'], c:q.c ? 0 : 1}; });
  return a.concat(b);
}
function seq(){ var a=[]; for(var i=1;i<=N;i++) a.push(i); return a; }
function validOrder(o){
  if(!o || o.length !== N) return false;
  var s = {}; for(var i=0;i<o.length;i++){ if(o[i]<1 || o[i]>N || s[o[i]]) return false; s[o[i]]=1; }
  return true;
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      piles = d.piles || {}; order = d.order || {}; at = d.at || {};
      prog = d.prog || {}; held = d.held || {}; pile = d.pile || 'live';
    }
  }catch(e){}
  fix();
}
function fix(){
  if(PILES.indexOf(pile) < 0) pile = 'live';
  for(var n=1;n<=N;n++) if(PILES.indexOf(piles[n]) < 0) piles[n] = 'live';
  PILES.forEach(function(p){ if(!validOrder(order[p])) order[p] = seq(); });
}
function save(){
  if(cur) prog[pile] = cur;
  try{
    localStorage.setItem(KEY, JSON.stringify({piles:piles, order:order, at:at, prog:prog, held:held, pile:pile}));
  }catch(e){}
}

function counts(){
  var c = {live:0, known:0, notquite:0, important:0};
  for(var n=1;n<=N;n++) c[piles[n]]++;
  return c;
}
function buildQueue(){
  queue = order[pile].filter(function(n){ return piles[n] === pile; });
}
/* first topic still in this pile at or after topic n in this pile's order */
function nextFrom(n, skipSelf){
  var o = order[pile], i = o.indexOf(n);
  if(i < 0) i = 0;
  for(var k = skipSelf ? 1 : 0; k <= N; k++){
    var m = o[(i + k) % N];
    if(piles[m] === pile) return m;
  }
  return 0;
}
function stash(p){ if(p && p.n && p.ans && p.ans.length) held[p.n] = p; }
function open(n){
  if(!n){ cur = null; return; }
  at[pile] = n;
  var p = prog[pile];
  if(!(p && p.n === n && p.ans && p.ans.length <= 10)){ stash(p); p = held[n]; }
  if(p && p.n === n && p.ans && p.ans.length <= 10) cur = p;
  else cur = {n:n, step:0, ans:[], pick:null};
  delete held[n];
}
/* enter the current pile at the point you left it */
function enter(){
  buildQueue();
  var n = at[pile] ? nextFrom(at[pile], false) : (queue[0] || 0);
  open(n);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function wrongs(){
  var it = items(topic(cur.n)), w = [];
  cur.ans.forEach(function(a,i){ if(a !== it[i].c) w.push(i); });
  return w;
}

function render(){
  setTimeout(function(){ if(typeof syncAudio === 'function') syncAudio(); }, 0);
  var c = counts();
  PILES.forEach(function(p){ document.getElementById('n-'+p).textContent = c[p]; });
  [].forEach.call(document.querySelectorAll('.pile'), function(b){ b.classList.toggle('sel', b.dataset.p === pile); });

  var box = document.getElementById('card'), go = document.getElementById('go'), filing = document.getElementById('filing');
  if(!cur){
    document.getElementById('counter').textContent = '0 / 0';
    box.innerHTML = '<div class="empty">Nothing in ' + NAMES[pile] + '.<br>Pick another pile above.</div>';
    go.classList.add('hide'); filing.classList.add('hide');
    return;
  }
  var t = topic(cur.n), it = items(t);
  var qi = queue.indexOf(cur.n);
  document.getElementById('counter').textContent = 'Θέμα ' + (qi + 1) + ' / ' + queue.length;

  var dots = '<div class="dots">';
  for(var i=0;i<10;i++){
    if(i === 5) dots += '<span class="gap"></span>';
    var cls = i < cur.ans.length ? (cur.ans[i] === it[i].c ? 'ok' : 'bad') : (i === cur.step ? 'cur' : '');
    dots += '<span class="' + cls + '"></span>';
  }
  dots += '</div>';

  var head = '<div class="qnum"><span>Θέμα ' + t.n + '</span><span>in ' + NAMES[piles[t.n]] + '</span></div>';

  if(cur.step >= 10){                       /* ---- end of topic: score + filing ---- */
    var w = wrongs();
    if(!cur.pick) cur.pick = w.length ? 'important' : 'known';
    var h = head + dots + '<div class="sum"><h2>Θέμα ' + t.n + ' done</h2>' +
            '<div class="score">' + (10 - w.length) + ' / 10 correct</div>';
    if(!w.length) h += '<div class="allok">All correct</div>';
    w.forEach(function(i){
      var q = it[i];
      h += '<div class="miss"><div class="mq">' + (q.part === 'A' ? 'Μέρος Α' : 'Μέρος Β') + ' ' + (q.i+1) + '. ' + esc(q.q) + '</div>' +
           '<div class="y">✗ ' + esc(label(q, cur.ans[i])) + '</div>' +
           '<div class="c">✓ ' + esc(label(q, q.c)) + '</div></div>';
    });
    h += '</div>';
    box.innerHTML = h;
    go.textContent = 'Confirm → ' + NAMES[cur.pick] + ' & next';
    go.classList.remove('hide'); filing.classList.remove('hide');
    [].forEach.call(document.querySelectorAll('.sort'), function(b){ b.classList.toggle('pick', b.dataset.p === cur.pick); });
    return;
  }

  filing.classList.add('hide');
  var q = it[cur.step], answered = cur.ans.length > cur.step;
  var h = head + dots +
    '<div class="instr"><span class="part">ΜΕΡΟΣ ' + (q.part === 'A' ? 'Α' : 'Β') + '</span> · ' + esc(q.part === 'A' ? t.ia : t.ib) + '</div>' +
    '<div class="q">' + (q.i+1) + '. ' + esc(q.q) + '</div>' +
    '<div class="opts' + (q.part === 'B' ? ' tf' : '') + '">';
  q.o.forEach(function(o,k){
    var cls = '';
    if(answered){
      if(k === q.c) cls = 'ok';
      else if(k === cur.ans[cur.step]) cls = 'bad';
      else cls = 'dim';
    }
    h += '<button class="opt ' + cls + '" data-k="' + k + '"' + (answered ? ' disabled' : '') + '>' +
         (q.part === 'A' ? '<span class="l">' + LET[k] + ')</span>' : '') + '<span>' + esc(o) + '</span></button>';
  });
  h += '</div>';
  box.innerHTML = h;
  [].forEach.call(box.querySelectorAll('.opt'), function(b){
    b.addEventListener('click', function(){ answer(+b.dataset.k); });
  });
  go.textContent = cur.step === 9 ? 'See result' : 'Next question';
  go.classList.toggle('hide', !answered);
}
function label(q,k){ return q.part === 'A' ? LET[k] + ') ' + q.o[k] : q.o[k]; }

function answer(k){
  if(!cur || cur.ans.length > cur.step) return;
  cur.ans.push(k);
  save(); render();
}
function goNext(){
  if(!cur) return;
  if(cur.step < 10){
    if(cur.ans.length <= cur.step) return;
    cur.step++; save(); render(); window.scrollTo(0,0); return;
  }
  /* confirm: file the whole topic, then move on */
  var n = cur.n;
  piles[n] = cur.pick || 'important';
  delete prog[pile]; delete held[n]; cur = null;
  buildQueue();
  open(nextFrom(n, true));
  save(); render(); window.scrollTo(0,0);
}
function step(d){            /* Back / Skip between topics without filing */
  if(!queue.length) return;
  var i = queue.indexOf(cur ? cur.n : 0);
  var n = queue[(i + d + queue.length) % queue.length];
  if(cur && n === cur.n) return;
  stash(cur); delete prog[pile]; cur = null;
  open(n); save(); render(); window.scrollTo(0,0);
}

document.getElementById('go').addEventListener('click', goNext);
document.getElementById('skip').addEventListener('click', function(){ step(1); });
function jump(){
  var box = document.getElementById('jump-n'), n = parseInt(box.value, 10);
  if(!(n >= 1 && n <= N)){ box.value = ''; box.placeholder = 'Only 1–50'; box.focus(); return; }
  box.value = ''; box.blur();
  save();                                   /* keep your place in the pile you are leaving */
  pile = piles[n];
  cur = null; buildQueue(); open(n);
  save(); render(); window.scrollTo(0,0);
}
document.getElementById('jump-go').addEventListener('click', jump);
document.getElementById('jump-n').addEventListener('keydown', function(e){ if(e.key === 'Enter') jump(); });
document.getElementById('back').addEventListener('click', function(){ step(-1); });
document.getElementById('shuffle').addEventListener('click', function(){
  if(!confirm('Shuffle the order of ' + NAMES[pile] + ' and start it from the top?')) return;
  var o = seq();
  for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=o[i]; o[i]=o[j]; o[j]=x; }
  order[pile] = o; stash(cur); delete prog[pile]; delete at[pile]; cur = null;
  enter(); save(); render();
});
[].forEach.call(document.querySelectorAll('.pile'), function(b){
  b.addEventListener('click', function(){
    if(b.dataset.p === pile) return;
    save();                     /* keeps where you are in the pile you are leaving */
    pile = b.dataset.p; cur = null;
    enter(); save(); render(); window.scrollTo(0,0);
  });
});
[].forEach.call(document.querySelectorAll('.sort'), function(b){
  b.addEventListener('click', function(){
    if(!cur || cur.step < 10) return;
    cur.pick = b.dataset.p; save(); render();
  });
});

document.getElementById('backup').addEventListener('click', function(){
  save();
  var txt = JSON.stringify({app:'pegp-akoustika', saved:new Date().toISOString(),
    piles:piles, order:order, at:at, prog:prog, held:held, pile:pile});
  var stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  try{
    var url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    var a = document.createElement('a');
    a.href = url; a.download = 'akoustika-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){ prompt('Copy this backup text and keep it somewhere safe:', txt); }
});
document.getElementById('restore').addEventListener('click', function(){ document.getElementById('restore-file').click(); });
document.getElementById('restore-file').addEventListener('change', function(ev){
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || d.app !== 'pegp-akoustika' || !d.piles) throw 0;
      var c = {live:0, known:0, notquite:0, important:0};
      for(var n=1;n<=N;n++){ var p = d.piles[n]; c[PILES.indexOf(p) > -1 ? p : 'live']++; }
      if(!confirm('Restore this backup?\n\nLive ' + c.live + ' · Known ' + c.known +
                  ' · Not quite ' + c.notquite + ' · Important ' + c.important +
                  '\n\nEverything you have here now will be replaced.')) return;
      piles = d.piles; order = d.order || {}; at = d.at || {}; prog = d.prog || {}; held = d.held || {}; pile = d.pile || 'live';
      fix(); cur = null; enter(); save(); render();
    }catch(e){ alert('That file is not a valid Ακουστικά backup.'); }
  };
  r.readAsText(f);
});
document.getElementById('reset').addEventListener('click', function(){
  if(!confirm('Reset all 50 topics back to Live?\n\nTake a Backup first if you might want them back.')) return;
  for(var n=1;n<=N;n++) piles[n] = 'live';
  order = {}; at = {}; prog = {}; held = {}; pile = 'live'; fix();
  cur = null; enter(); save(); render();
});

/* ---------------- Audio: the mp3s live on the phone and are copied once into the app ---------------- */
var ADB = 'pegp-akoustika-audio', AKEY = 'pegp-akoustika-audiopos';
var have = {};            /* n -> true for topics with audio stored */
var aN = 0, aHave = false, aURL = null, apos = {};
try{ apos = JSON.parse(localStorage.getItem(AKEY) || '{}') || {}; }catch(e){ apos = {}; }
function db(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(ADB, 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('files'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function dbDo(mode, fn){
  return db().then(function(d){ return new Promise(function(res, rej){
    var tx = d.transaction('files', mode), st = tx.objectStore('files'), out = fn(st);
    tx.oncomplete = function(){ res(out && 'result' in out ? out.result : out); };
    tx.onerror = function(){ rej(tx.error); };
  }); });
}
function refreshHave(){
  return dbDo('readonly', function(st){ return st.getAllKeys(); }).then(function(keys){
    have = {}; (keys || []).forEach(function(k){ have[k] = true; });
    document.getElementById('aud').textContent = 'Audio (' + Object.keys(have).length + '/50)';
  }).catch(function(){});
}
function toast(msg, ms){
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toast.h); if(ms !== 0) toast.h = setTimeout(function(){ t.classList.add('hide'); }, ms || 3500);
}
function fmt(x){ x = Math.max(0, Math.floor(x || 0)); return Math.floor(x/60) + ':' + ('0' + x % 60).slice(-2); }
function keepPos(){
  var a = document.getElementById('p-audio');
  if(aN && a.src){ apos[aN] = a.currentTime; try{ localStorage.setItem(AKEY, JSON.stringify(apos)); }catch(e){} }
}
/* called after every render: loads the right file when the topic changes */
function syncAudio(){
  var n = cur ? cur.n : 0, a = document.getElementById('p-audio');
  document.getElementById('player').classList.toggle('hide', !n);
  if(n === aN && aHave === !!have[n]) return;
  keepPos(); a.pause();
  if(aURL){ URL.revokeObjectURL(aURL); aURL = null; }
  a.removeAttribute('src'); a.load();
  aN = n; aHave = !!have[n]; paint();
  if(!n) return;
  document.getElementById('p-lab').textContent = 'Ήχος · Θέμα ' + n + ' · Μέρος Α + Β';
  var on = !!have[n];
  document.getElementById('p-ctrl').classList.toggle('hide', !on);
  var none = document.getElementById('p-none');
  none.classList.toggle('hide', on);
  if(!on){
    none.innerHTML = 'No audio for Θέμα ' + n + ' yet. <button id="p-add">Add audio files</button>';
    document.getElementById('p-add').addEventListener('click', pickAudio);
    return;
  }
  dbDo('readonly', function(st){ return st.get(n); }).then(function(rec){
    if(aN !== n || !rec) return;
    aURL = URL.createObjectURL(rec.blob); a.src = aURL;
    a.addEventListener('loadedmetadata', function once(){
      a.removeEventListener('loadedmetadata', once);
      var p = apos[n] || 0; if(p > 0 && p < a.duration - 1) a.currentTime = p;
      paint();
    });
  });
}
function paint(){
  var a = document.getElementById('p-audio'), d = a.duration || 0;
  document.getElementById('p-play').textContent = a.paused ? '▶' : '❚❚';
  document.getElementById('p-time').textContent = fmt(a.currentTime) + ' / ' + fmt(d);
  if(!paint.drag) document.getElementById('p-seek').value = d ? Math.round(a.currentTime / d * 1000) : 0;
}
(function(){
  var a = document.getElementById('p-audio'), sk = document.getElementById('p-seek');
  document.getElementById('p-play').addEventListener('click', function(){
    if(!a.src) return;
    if(a.paused){ if(a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  });
  document.getElementById('p-back').addEventListener('click', function(){ if(a.src) a.currentTime = Math.max(0, a.currentTime - 10); paint(); });
  sk.addEventListener('input', function(){ paint.drag = true;
    if(a.duration) document.getElementById('p-time').textContent = fmt(sk.value/1000*a.duration) + ' / ' + fmt(a.duration); });
  sk.addEventListener('change', function(){ paint.drag = false; if(a.duration) a.currentTime = sk.value/1000*a.duration; paint(); });
  ['play','pause','timeupdate','durationchange','ended'].forEach(function(ev){ a.addEventListener(ev, paint); });
  a.addEventListener('pause', keepPos);
  a.addEventListener('ended', function(){ apos[aN] = 0; try{ localStorage.setItem(AKEY, JSON.stringify(apos)); }catch(e){} });
  window.addEventListener('pagehide', keepPos);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) keepPos(); });
})();
function pickAudio(){ document.getElementById('audio-file').click(); }
document.getElementById('aud').addEventListener('click', function(){
  var k = Object.keys(have).length;
  if(k && !confirm('Audio stored for ' + k + ' of 50 topics.\n\nPick more mp3 files now? Files you pick replace the ones with the same number.')) return;
  pickAudio();
});
document.getElementById('audio-file').addEventListener('change', function(ev){
  var fs = [].slice.call(ev.target.files || []); ev.target.value = '';
  if(!fs.length) return;
  var ok = [], skip = [];
  fs.forEach(function(f){
    var m = /^\s*(\d{1,2})\s*-/.exec(f.name), n = m ? +m[1] : 0;
    if(n >= 1 && n <= 50) ok.push({n:n, f:f}); else skip.push(f.name);
  });
  if(!ok.length){ alert('None of those files start with a topic number like "01-".'); return; }
  toast('Saving ' + ok.length + ' audio file(s)… keep the app open', 0);
  var i = 0;
  (function next(){
    if(i >= ok.length){
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
      refreshHave().then(function(){
        aN = -1; syncAudio();
        toast('Saved ' + ok.length + ' file(s). Audio now for ' + Object.keys(have).length + ' of 50 topics.' +
              (skip.length ? ' Skipped ' + skip.length + ' without a number.' : ''), 5000);
      });
      return;
    }
    var it = ok[i++];
    dbDo('readwrite', function(st){ st.put({blob:it.f, name:it.f.name}, it.n); })
      .then(function(){ toast('Saving audio… ' + i + ' / ' + ok.length, 0); next(); })
      .catch(function(){ toast('Could not save ' + it.f.name + ' — phone storage may be full.', 6000); });
  })();
});

load(); enter(); render(); refreshHave().then(syncAudio);
</script>
